<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="lightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E6CF7A" stop-opacity="1" />
      <stop offset="45%" stop-color="#C9A227" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- 8-pointed Rub el Hizb star -->
  <rect x="26" y="26" width="68" height="68" stroke="#C9A227" stroke-width="2" />
  <rect x="26" y="26" width="68" height="68" stroke="#C9A227" stroke-width="2" transform="rotate(45 60 60)" />
  <!-- Open book -->
  <path d="M40 69 C47 64, 54 64, 60 69 C66 64, 73 64, 80 69" stroke="#C9A227" stroke-width="2.2" stroke-linecap="round" />
  <path d="M40 74 C47 69, 54 69, 60 74 C66 69, 73 69, 80 74" stroke="#C9A227" stroke-width="1.4" stroke-linecap="round" opacity="0.7" />
  <!-- Point of light -->
  <circle cx="60" cy="48" r="10" fill="url(#lightGlow)" />
  <circle cx="60" cy="48" r="3" fill="#E6CF7A" />
</svg>
